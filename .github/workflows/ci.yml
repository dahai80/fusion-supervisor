name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"

# issue #129 (fusion#2 CI retrofit): 同 ref 新提交取消排队/在跑的旧 run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets

  # issue #129: rustfmt 与平台无关, 移 ubuntu 释放 macOS runner 名额 (macOS 队列是墙钟瓶颈)
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: fusion-sv
          path: target/release/fusion-sv
      - uses: actions/upload-artifact@v4
        with:
          name: fusion-tray
          path: target/release/fusion-tray

  # Windows 编译门 — release.yml 现默认打包 windows/linux/macos 三平台,
  # cfg 门 (UDS/flock/process_group/localtime) 漂移在每个 PR 上就要暴露,
  # 不能等到 tag push 的 release build 才炸。
  # 范围只 check 主二进制 (tray 是 eframe 桌面应用, 不发布 windows)。
  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --bin fusion-sv
