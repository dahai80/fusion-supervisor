[package]
name = "fusion-supervisor"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Local-first fusion service supervisor and monitor"

[lib]
name = "fusion_supervisor"
path = "src/lib.rs"

[[bin]]
name = "fusion-sv"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tabled = "0.17"
toml = "0.8"
dirs = "6"
indexmap = { version = "2", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
