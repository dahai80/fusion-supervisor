# fusion-supervisor 业务面 overlay — 与 docker-compose.sidecar.yml (base, 中间件/数据面)
# 或 fusion-multi-node/docker-compose.yml (base, 集群面) 叠加。
# 单独不可用 (依赖 fusion-cluster 网络 + sidecar 服务, 由 base 创建); 合并启动:
#   生产 (中间件+业务):
#     docker compose -f docker-compose.sidecar.yml -f docker-compose.business.yml up -d
#   集群+业务:
#     docker compose -f ../fusion-multi-node/docker-compose.yml -f docker-compose.business.yml up -d
# 每服务 host-map 注册端口 (port-registry.yaml 权威), fusion-sv 探活不变。
# MLX 裸机: 经 host.docker.internal:11434 回连 (Docker Desktop 内置; Linux 由 base extra_hosts 解析)。
# UDS 守护面 (memory/speech) 不容器化 — UDS 不过容器边界, 留裸机 (见设计 §2.3)。
networks:
  fusion-cluster:
    external: true
    name: fusion-cluster

services:
  fusion-model-hub:          # Dockerfile 已有 — health :11444/api/v1/system/health
    # Upstream Dockerfile installs the full monorepo requirements.lock, which
    # includes sdist packages (miniaudio) needing a C++ compiler that
    # python:3.12-slim lacks — upstream build fails (issue filed). Smoke uses a
    # wrapper (scripts/Dockerfile.model-hub-smoke) that adds build-essential;
    # otherwise identical. Context staged by prepare-build-ctx.sh (.build-ctx/).
    build:
      context: ../fusion-supervisor/.build-ctx
      dockerfile: ../scripts/Dockerfile.model-hub-smoke
    image: fusion-model-hub:smoke
    ports: ["11444:11444"]
    environment:
      FUSION_MLX_URL: "http://host.docker.internal:11434"
      FUSION_MLX_API_KEY: "${FUSION_MLX_API_KEY:?必须设置 FUSION_MLX_API_KEY — fusion-mlx 启用的 api_key}"
      # sidecar 中间件连接 (issue #1): 共享 PG/Redis 实例, 各 app 按库名连
      DATABASE_URL: "postgresql://${FUSION_PG_USER:-fusion}:${FUSION_PG_PASSWORD}@postgres:5432/${FUSION_MODELHUB_DB:-modelhub}"
      REDIS_URL: "redis://redis:6379/0"
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [fusion-cluster]
    restart: unless-stopped
    labels:
      # Traefik 路由 (issue #1): 中间件面 Traefik 统一接入, 路由到容器化业务
      - "traefik.enable=true"
      - "traefik.http.routers.model-hub.rule=PathPrefix(`/api/v1/model`)"
      - "traefik.http.routers.model-hub.entrypoints=websecure"
      - "traefik.http.routers.model-hub.tls=true"
      - "traefik.http.services.model-hub.loadbalancer.server.port=11444"
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
    mem_limit: "2g"
    cpus: "2"

  fusion-cowork:             # Dockerfile 已有 — health :11438/health
    # Dockerfile COPYs fusion-core/ + fusion-cowork/ from context root — staged
    # into .build-ctx/ by scripts/prepare-build-ctx.sh (lean context). dockerfile
    # stays in its source repo. Run prepare-build-ctx.sh before `docker compose build`.
    # issue #1: 不再自建 dev-only postgres, 连共享 sidecar PG (库名 cowork, RLS 不变)
    build:
      context: ../fusion-supervisor/.build-ctx
      dockerfile: ../../fusion-cowork/Dockerfile
    image: fusion-cowork:smoke
    ports: ["11438:11438"]
    environment:
      FUSION_MLX_URL: "http://host.docker.internal:11434"
      FUSION_MLX_API_KEY: "${FUSION_MLX_API_KEY:?必须设置 FUSION_MLX_API_KEY}"
      DATABASE_URL: "postgresql://${FUSION_PG_USER:-fusion}:${FUSION_PG_PASSWORD}@postgres:5432/${FUSION_COWORK_DB:-cowork}"
      REDIS_URL: "redis://redis:6379/1"
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [fusion-cluster]
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cowork.rule=PathPrefix(`/api/cowork`)"
      - "traefik.http.routers.cowork.entrypoints=websecure"
      - "traefik.http.routers.cowork.tls=true"
      - "traefik.http.services.cowork.loadbalancer.server.port=11438"
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
    mem_limit: "2g"
    cpus: "2"
