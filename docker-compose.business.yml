# fusion-supervisor 业务面 overlay — 与 fusion-multi-node/docker-compose.yml (base, 集群面) 叠加。
# 单独不可用 (依赖 fusion-cluster 网络, 由 base 创建); 合并启动:
#   docker compose -f ../fusion-multi-node/docker-compose.yml -f docker-compose.business.yml up -d
# 每服务 host-map 注册端口 (port-registry.yaml 权威), fusion-sv 探活不变。
# MLX 裸机: 经 host.docker.internal:11434 回连 (Docker Desktop 内置; Linux 由 base extra_hosts 解析)。
# UDS 守护面 (memory/speech) 不容器化 — UDS 不过容器边界, 留裸机 (见设计 §2.3)。
networks:
  fusion-cluster:
    external: true
    name: fusion-cluster

services:
  fusion-model-hub:          # Dockerfile 已有 — health :11444/api/v1/system/health
    # Upstream Dockerfile installs the full monorepo requirements.lock, which
    # includes sdist packages (miniaudio) needing a C++ compiler that
    # python:3.12-slim lacks — upstream build fails (issue filed). Smoke uses a
    # wrapper (scripts/Dockerfile.model-hub-smoke) that adds build-essential;
    # otherwise identical. Context staged by prepare-build-ctx.sh (.build-ctx/).
    build:
      context: ../fusion-supervisor/.build-ctx
      dockerfile: ../scripts/Dockerfile.model-hub-smoke
    image: fusion-model-hub:smoke
    ports: ["11444:11444"]
    environment:
      FUSION_MLX_URL: "http://host.docker.internal:11434"
      FUSION_MLX_API_KEY: "${FUSION_MLX_API_KEY:?必须设置 FUSION_MLX_API_KEY — fusion-mlx 启用的 api_key}"
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [fusion-cluster]
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
    mem_limit: "2g"
    cpus: "2"

  fusion-cowork:             # Dockerfile 已有 — health :11438/health
    # Dockerfile COPYs fusion-core/ + fusion-cowork/ from context root — staged
    # into .build-ctx/ by scripts/prepare-build-ctx.sh (lean context). dockerfile
    # stays in its source repo. Run prepare-build-ctx.sh before `docker compose build`.
    build:
      context: ../fusion-supervisor/.build-ctx
      dockerfile: ../../fusion-cowork/Dockerfile
    image: fusion-cowork:smoke
    ports: ["11438:11438"]
    environment:
      FUSION_MLX_URL: "http://host.docker.internal:11434"
      FUSION_MLX_API_KEY: "${FUSION_MLX_API_KEY:?必须设置 FUSION_MLX_API_KEY}"
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [fusion-cluster]
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
    mem_limit: "2g"
    cpus: "2"
