# fusion-supervisor sidecar base — middleware/data plane for production deploy.
# Implements architecture/fusion-deploy-0902.md §1.1 OrbStack sidecar layer:
#   Traefik (reverse proxy / TLS / tenant routing) + Redis (quota/lock/rate-limit)
#   + PostgreSQL (tenant/perm/session/project metadata) + Qdrant (fusion-rag vectors).
#
# Base of the layered stack. Bring up with the business overlay:
#   docker compose -f docker-compose.sidecar.yml -f docker-compose.business.yml up -d
#
# MLX + fusion-gateway core stay NATIVE (host), reached via host.docker.internal
# (plan §1.2: inference + VRAM layer must not be containerized). Traefik routes
# to the native gateway at host.docker.internal:11432.
#
# Ports respect architecture/port-registry.yaml — sidecar middleware uses the
# reserved standard ports (5432 PG, 6379 Redis, 6333 Qdrant, 8080/8443 Traefik),
# none collide with the 41 fusion service ports (11xxx range).
networks:
  fusion-cluster:
    name: fusion-cluster

volumes:
  pg_data:
  qdrant_data:
  redis_data:
  traefik_letsencrypt:

services:
  traefik:
    image: traefik:v3.1
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=fusion-cluster
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # dashboard on :8080 (internal, not exposed to host by default)
      - --api.dashboard=true
      - --api.insecure=true
      - --entrypoints.traefik.address=:8080
      # Let's Encrypt ACME (production domain set via FUSION_DOMAIN)
      - --certificatesresolvers.le.acme.email=${FUSION_ACME_EMAIL:-admin@fusion.local}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --log.level=${FUSION_LOG_LEVEL:-INFO}
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks: [fusion-cluster]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
    mem_limit: "512m"
    cpus: "1"

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - ${FUSION_REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks: [fusion-cluster]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
    mem_limit: "512m"
    cpus: "1"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${FUSION_PG_USER:-fusion}
      POSTGRES_PASSWORD: ${FUSION_PG_PASSWORD:?必须设置 FUSION_PG_PASSWORD — 共享 PG 实例密码}
      POSTGRES_DB: ${FUSION_PG_DB:-fusion}
      # fusion-cowork + fusion-identity + fusion-rag all get their own DBs in one instance.
      # Create them at first boot so apps connect by name (no self-hosted PG per app).
      POSTGRES_MULTIPLE_DATABASES: ${FUSION_PG_DATABASES:-cowork,identity,rag}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/pg-init-multiple-db.sh:/docker-entrypoint-initdb.d/pg-init-multiple-db.sh:ro
    networks: [fusion-cluster]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FUSION_PG_USER:-fusion} -d ${FUSION_PG_DB:-fusion}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
    mem_limit: "1g"
    cpus: "2"

  qdrant:
    image: qdrant/qdrant:v1.12.4
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
      QDRANT__LOG_LEVEL: ${FUSION_LOG_LEVEL:-INFO}
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [fusion-cluster]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo GET /readyz HTTP/1.1 >&3 && echo >&3 && head -n1 <&3 | grep -q 200'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
    mem_limit: "1g"
    cpus: "2"
